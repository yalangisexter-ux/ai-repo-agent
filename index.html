<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>AI Repo Agent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<main>
<header>
  <h1>AI Repo Agent</h1>
  <p>iPhone-first GitHub coding agent</p>
</header>

<section class="card">
  <h2>Configuration</h2>
  <label>GitHub repository
    <input id="repo" placeholder="owner/repository" autocomplete="off">
  </label>
  <label>Branch
    <input id="branch" value="main" autocomplete="off">
  </label>
  <label>GitHub Personal Access Token
    <input id="githubToken" type="password" placeholder="github_pat_..." autocomplete="off">
  </label>
  <label>OpenRouter API Key
    <input id="openrouterKey" type="password" placeholder="sk-or-v1-..." autocomplete="off">
  </label>
  <label>OpenRouter model
    <input id="model" value="minimax/minimax-m3:free" autocomplete="off">
  </label>
  <label>Optional Worker URL
    <input id="workerUrl" placeholder="https://your-worker.workers.dev" autocomplete="off">
  </label>
  <button id="load">Load repository</button>
</section>

<section class="card">
  <h2>💬 Talk to the Agent</h2>
  <p class="muted">Describe what you want changed, ask for a review, or request suggestions.</p>
  <textarea id="prompt" rows="5" placeholder="Example: Review this repository for security issues and suggest fixes..."></textarea>
  <div class="row">
    <button id="sendPrompt">Send to Agent</button>
    <button id="clearChat">Clear chat</button>
  </div>
  <div id="chat" class="chat"></div>
</section>

<section class="card">
  <h2>Agent</h2>
  <p id="status">Load a repository to begin.</p>
  <div class="row">
    <button id="selectAll" disabled>Select all</button>
    <button id="clear" disabled>Clear</button>
  </div>
  <div id="files" class="files"></div>
  <button id="analyze" disabled>🤖 Plan &amp; Analyze</button>
</section>

<section id="reviewCard" class="card hidden">
  <h2>Review changes</h2>
  <div id="review"></div>
  <button id="commit">Create backup &amp; commit approved changes</button>
</section>

<footer>Repository-level agent · OpenRouter · GitHub</footer>
</main>
<script src="app.js?v=5"></script>
</body>
</html>
